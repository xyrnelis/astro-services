name: Deploy Astro Services to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build site
        run: npm run build

      - name: Verify published files and license
        run: |
          test -s dist/index.html
          test -s dist/LICENSE
          test -s dist/NOTICE.html
          test -f dist/src/main.js
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' dist/LICENSE
          test "$(wc -c < dist/LICENSE)" -gt 30000
          grep -q 'https://github.com/xyrnelis/astro-services' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
