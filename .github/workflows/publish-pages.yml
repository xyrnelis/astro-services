name: Publish website to public GitHub Pages repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-public-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build static website
        run: node scripts/build.mjs

      - name: Publish generated files to public repository
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          TARGET_REPO: ${{ github.repository_owner }}/astro-services-site
        run: |
          set -euo pipefail
          if [[ -z "$PAGES_TOKEN" ]]; then
            echo 'Missing repository Actions secret: PAGES_TOKEN'
            exit 1
          fi

          git clone --depth 1 "https://x-access-token:${PAGES_TOKEN}@github.com/${TARGET_REPO}.git" website
          find website -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. website/
          touch website/.nojekyll

          cd website
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No website changes to publish.'
            exit 0
          fi
          git commit -m "Publish website from ${GITHUB_SHA}"
          git push origin main
