<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Astro Services: расчёт каналов натальной карты" />
    <title>Astro Services | Каналы натальной карты</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Натальная карта</p>
        <h1>Каналы</h1>
      </header>
      <div class="top-layout">
      <section class="input-panel" aria-labelledby="birth-data-title">
        <h2 id="birth-data-title">Данные рождения</h2>
        <form id="birth-form" novalidate>
          <div class="form-grid">
            <label>Дата<input name="date" type="date" required /></label>
            <label>Время<input name="time" type="time" required /></label>
            <label class="city-field">Город<input name="city" type="search" autocomplete="off" placeholder="Например, Минск" required /></label>
            <button class="secondary-button" id="city-search" type="button">Найти город</button>
          </div>
          <div id="city-results" class="city-results" aria-live="polite"></div>
          <div class="offset-controls">
            <label class="checkbox-label"><input id="use-offset" type="checkbox" /><span>Использовать<br />UTC-offset</span></label>
            <label id="offset-field" hidden>UTC-offset<input name="utcOffset" type="text" inputmode="text" placeholder="+03:00" /></label>
            <output id="location-output">Город не выбран</output>
          </div>
          <div class="form-actions"><button class="primary-button" type="submit">Рассчитать</button><button class="secondary-button" id="clear-form" type="button">Очистить</button></div>
        </form>
      </section>
      <section id="positions-results" class="positions-results" aria-live="polite"></section>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <section id="results" class="results" aria-live="polite"></section>
      <footer aria-label="Информация о лицензиях" style="margin-top:32px; padding-top:16px; border-top:1px solid #d8e0de; color:#52615c; font-size:13px;">
        <a href="https://github.com/xyrnelis/astro-services" target="_blank" rel="noopener noreferrer">Исходный код (GNU AGPL v3)</a>
        <span aria-hidden="true"> · </span>
        <a href="./NOTICE.html">Лицензии компонентов</a>
      </footer>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
